limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
      return 404;
    }

    location ~* \.(env|git|gitignore|gitattributes|gitmodules|svn|hg|htaccess|htpasswd|ini|log|sql|bak|backup|swp|tmp|temp|conf|config|yml|yaml|json|lock|md5|sh)$ {
      deny all;
      access_log off;
      log_not_found off;
      return 404;
    }

    location ~ ^/(\.git|\.svn|\.hg|\.env|env|config|backup|temp|tmp|logs|\.vscode|\.idea|node_modules) {
      deny all;
      access_log off;
      log_not_found off;
      return 404;
    }

    location / {
      limit_req zone=general burst=20 nodelay;
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
      limit_req zone=general burst=50 nodelay;
      expires 5d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    server_tokens off;
}

